        var b2 = read();

      var bytes = [];

        if (c < 128) {

 readConfig(strict=true){if(!$('#cfg-rounds'))return clone(App.formCfg||DEFAULT);App.customText=$('#cfg-custom').value;return {rounds:+$('#cfg-rounds').value,steps:+$('#cfg-steps').value,timer:+$('#cfg-timer').value,drop:$('#cfg-drop').value,theme:$('#cfg-theme').value,classification:$('#cfg-class').value,favorite:$('#cfg-favorite').checked,custom:strict?Content.custom(App.customText):[]}},
 lobby(v){return `<section class="setup-scroll glass"><div class="row between">${B('← Sair','exit','','small')}<span class="eyebrow">${App.spectator?'TELÃO':'SALA ONLINE'}</span></div><h2>A corte está se reunindo.</h2><p class="room-code">${esc(App.room)}</p><div class="row">${B('Copiar código','copycode')}${B('Copiar convite','copylink')}</div>${App.host?location.protocol==='file:'?'<p class="hint">Publique os dois arquivos em um site HTTPS para gerar o QR de entrada. Por enquanto, compartilhe o HTML e este código.</p>':'<div id="qr" class="qr"></div><p class="hint">Abra a câmera do celular e escaneie.</p>':''}<h3>${v.players.length}/8 jogadores</h3>${v.players.map(p=>`<div class="player">${portrait(p.skin)}<span><b>${esc(p.name)}</b><small>${p.online?'Pronto para a corte':'Desconectado · vaga reservada'}</small></span></div>`).join('')}${App.host?this.config()+B('Começar partida','hoststart',v.players.filter(p=>p.online).length<3?'disabled':'','primary wide'):'<p>Espere o anfitrião começar.</p>'}</section>`},
 status(v){return {royal:'A majestade está guardando um segredo…',answer:'Escrevam seus palpites!',judge:'Aguardando o veredito da majestade…',reveal:'Hora da verdade!',ceremony:'Abram caminho para a nova coroa!',result:'A corte decidiu.',finalpick:'Qual foi a resposta da noite?',final:'Longa vida ao caos!',paused:'Esperando alguém voltar à corte…'}[v.phase]||'A corte está se reunindo…'},
 game(v){if(!v)return '';const crown=v.players.find(p=>p.id===v.king),final=['final','finalpick'].includes(v.phase),type=v.q?.type;return `<div class="game-top">${B('← Sair','exit','','small')}<span class="tag">${final?'Pódio':`Rodada ${v.round}/${v.cfg.rounds}`}</span><span class="tag">${App.mode==='bots'?'TESTE':App.room?'SALA '+App.room:'PRESENCIAL'}</span></div><section class="paper ${final?'final-paper':''}"><div class="ribbon">${esc(final?'A lenda da colônia':TYPE_NAMES[type]||'A corte')}</div><small class="eyebrow">${final?'MAJESTADE DO CAOS':'SOBRE '+esc(crown?.name||'a majestade').toUpperCase()}</small><h2>${esc(final?'A noite foi de vocês.':v.prompt)}</h2>${v.notice?`<p class="notice">${esc(v.notice)}</p>`:''}<div id="timer" class="timer"></div>${this.action(v)}</section><aside class="score-panel ${App.score?'':'hidden'}"><div class="row between"><h3>Placar da corte</h3>${B('×','score','','small')}</div>${this.score(v)}<p class="hint">+100 por degrau · +300 por coroa${v.cfg.favorite?' · +50 de imposto real':''}</p></aside><aside class="history-panel ${App.history?'':'hidden'}"><div class="row between"><h3>Vereditos</h3>${B('×','history','','small')}</div>${v.rows.length?v.rows.map(r=>`<article class="history-card grade-${r.rating}"><strong>${['✗ Recusada','✦ Boa','♥ Favorita'][r.rating]}</strong><small>${esc(r.name)} · ${esc(r.prompt||'')}</small>${this.value(r.type,r.value,r.options)}</article>`).join(''):'<p>Os autores aparecem depois da revelação.</p>'}</aside>`},
 gate(v,id,content){if(App.mode!=='local')return content;const key=v.round+':'+v.phase+':'+id;if(App.unlocked===key)return content;const p=v.players.find(p=>p.id===id);return `<div class="handoff">${portrait(p.skin)}<h3>Passe para ${esc(p.name)}</h3><p>Só essa pessoa deve olhar a próxima tela.</p>${B('Estou com o aparelho','unlock',`data-id="${id}"`,'primary')}</div>`},
 action(v){const king=v.players.find(p=>p.id===v.king),actor=acting(),mine=App.mode==='local'||actor===v.king,canControl=authority();
 if(v.phase==='paused')return '<p>A partida está pausada até um jogador voltar. O código continua valendo.</p>';
 if(v.phase==='royal'){if(!mine||App.spectator)return '<p>A majestade está escolhendo a resposta dela em segredo. Prepare seu palpite!</p>';return this.gate(v,v.king,`<h3>Defina seu gabarito secreto.</h3><p>${v.individual?`Gabarito ${v.royalProgress.done+1}/${v.royalProgress.total}. Cada súdito recebe uma pergunta própria. Ninguém vê suas escolhas.`:'Os súditos tentarão adivinhar a sua escolha.'}</p>${this.form(v,true)}`)}
 if(v.phase==='answer'){if(App.spectator||actor===v.king)return `<p>Os súditos estão preparando os palpites. Seu segredo não aparece para ninguém.</p>${this.progress(v)}${canControl&&App.mode!=='bots'?B('Encerrar coleta','force','','ghost small'):''}`;
 if(v.submitted.includes(actor))return `<h3>Palpite enviado ✓</h3><p>O mafagafo-mensageiro levou seu pergaminho.</p>${this.progress(v)}`;
 return this.gate(v,actor,`${this.form(v,false)}${this.progress(v)}`)}
 if(v.phase==='judge'){if(!mine||App.spectator)return '<p>A majestade está avaliando os pergaminhos anônimos.</p>';const cards=v.cards,valid=cards.filter(c=>!c.missing);if(!valid.length)return '<p>Nenhuma resposta recebida.</p>';const c=cards.find(c=>c.slot===App.judgeSlot&&!c.missing)||valid[0];App.judgeSlot=c.slot;const hearts=cards.filter(c=>c.rating===2).length;
 return this.gate(v,v.king,`<div class="judge-tabs">${cards.map(c=>B(c.missing?'—':String(c.slot+1),'judgeslot',`data-slot="${c.slot}" ${c.missing?'disabled':''}`,c.slot===App.judgeSlot?'selected':'')).join('')}</div><article class="answer-card"><p><b>${esc(c.prompt||v.prompt)}</b></p>${this.value(c.type||v.q.type,c.value,c.options||v.q.options)}</article><label>Quanto essa resposta combina com você?</label><div class="grades">${[0,1,2].map(n=>B(['✗ Recusada<br>0 degraus','✦ Boa<br>+1 degrau','♥ Favorita<br>+2 degraus'][n],'rate',`data-slot="${c.slot}" data-value="${n}" aria-pressed="${c.rating===n}"`,'grade-'+n+(c.rating===n?' selected':''))).join('')}</div><p class="hint">${v.cfg.favorite?`Escolha exatamente uma ♥. Favoritas: ${hearts}/1. Você pode revisar as notas.`:'Dê 0, 1 ou 2 a cada resposta. Você pode revisar as notas.'}</p>${B('Confirmar vereditos','judge',v.judgeReady?'':'disabled','primary wide')}`)}
 if(v.phase==='reveal'){const a=v.active;return `<span class="tag dark">Pergaminho ${a.index+1}/${a.total}</span><article class="answer-card ${a.beat>=1?'grade-'+a.rating:''}">${a.beat>=1?`<div class="verdict">${['✗ Recusada · 0','✦ Boa · +1','♥ Favorita · +2'][a.rating]}</div>`:''}${this.value(v.q.type,a.value,v.q.options)}${a.beat>=2?`<strong class="author">— ${esc(a.name)}</strong>`:'<small>Autor ainda em segredo</small>'}</article>${a.beat===3?`<p>${a.rating?`${esc(a.name)} avança ${plural(a.rating,'degrau','degraus')}.`:'Desta vez, ninguém saiu do lugar.'}</p>`:''}${canControl?B(['Revelar a nota','Revelar o autor',a.rating?'Subir os degraus':'Concluir revelação',a.index+1<a.total?'Próximo pergaminho':'Concluir rodada'][a.beat],'reveal',`data-wait="${v.movingUntil||0}"`,'primary wide'):'<p>Acompanhe a revelação no telão ou na tela do anfitrião.</p>'}`}
 if(v.phase==='ceremony')return `<h3>Uma nova majestade!</h3><p>${esc(v.players.find(p=>p.id===v.ceremony.next)?.name)} conquistou a coroa. Abram caminho!</p>`;
 if(v.phase==='result')return `<h3>${v.ceremony?'A coroa mudou de cabeça.':'A majestade segurou o trono.'}</h3>${v.tax?'<p class="tax">Imposto real: +50 pontos para a majestade.</p>':''}${AUTO.includes(v.q.type)?(v.secrets||[{prompt:v.prompt,type:v.q.type,value:v.reference,options:v.q.options}]).map(x=>`<div class="answer-card"><small>O segredo da majestade</small><p>${esc(x.prompt)}</p>${this.value(x.type,x.value,x.options)}</div>`).join(''):''}<p>${v.ceremony?(v.cfg.drop==='half'?'A corte desceu pela metade. A antiga majestade voltou ao início.':'Todos voltaram ao início.'): 'Os degraus conquistados continuam valendo.'}</p>${canControl?B(v.round===v.cfg.rounds?'Ver o pódio':'Próxima rodada','advance','','primary wide'):'<p>Aguarde o anfitrião continuar.</p>'}`;
 if(v.phase==='finalpick'){if(!mine||App.spectator)return '<p>A última majestade está escolhendo a Resposta da noite entre as favoritas da partida.</p>';return this.gate(v,v.king,`<h3>Escolha a Resposta da noite.</h3>${v.favorites.map(f=>`<article class="answer-card"><small>${esc(f.name)} · ${esc(f.prompt)}</small>${this.value(f.type,f.value,f.options)}${B('Esta é a resposta da noite','pick',`data-id="${f.id}"`,'primary small')}</article>`).join('')}`)}
 if(v.phase==='final'){const max=Math.max(...v.players.map(p=>p.score)),names=v.players.filter(p=>p.score===max).map(p=>p.name);return `<h3 class="winner">${esc(names.join(' & '))}</h3><p>${max} pontos. ${names.length>1?'Vitória compartilhada!':'A coroa tem história para contar.'}</p>${this.awards(v).map(a=>`<div class="award"><b>${a.title}</b><span>${esc(a.names.join(' e '))}</span></div>`).join('')}${v.answerOfNight?`<article class="answer-card"><small>RESPOSTA DA NOITE · ${esc(v.answerOfNight.name)}</small>${this.value(v.answerOfNight.type,v.answerOfNight.value,v.answerOfNight.options)}</article>`:''}<div class="row">${B('Baixar imagem','download','','primary')}${B('Compartilhar','share')}</div>${canControl?B('Jogar novamente','rematch','','wide'):''}`}
 return ''},
 form(v,royal){const q=v.q;let form='';if(q.type==='texto'||q.type==='emoji')form=`<label for="answer">${royal?'Seu segredo':'Sua resposta secreta'}</label><textarea id="answer" maxlength="${q.type==='emoji'?80:240}" class="${App.secret?'concealed':''}" placeholder="${q.type==='emoji'?'Escolha até 3 emojis':'A majestade com certeza…'}">${esc(App.draft)}</textarea>${q.type==='emoji'?`<div class="emoji-picker">${['👑','😂','❤️','😴','☕','🎮','🍕','🎉','🤔','✨','🏃','🫂'].map(e=>B(e,'emoji',`data-emoji="${e}"`)).join('')}</div>`:''}`;
 if(q.type==='escolha')form=`<fieldset><legend>${royal?'Qual é a sua opção?':'Qual foi a escolha da majestade?'}</legend>${q.options.map((x,i)=>`<label class="option"><input type="radio" name="choice" value="${i}" ${App.choice===i?'checked':''}>${esc(x)}</label>`).join('')}</fieldset>`;
 if(q.type==='escala')form=`<label for="scale">0 = nada · 10 = muito</label><output id="scale-value">${App.scale??5}</output><input id="scale" type="range" min="0" max="10" step="1" value="${App.scale??5}"><p class="hint">Exato: +2. Diferença de até 2: +1. Mais distante: 0.</p>`;
 if(q.type==='ranking')form=`<p>Do primeiro ao último: use as setas para ordenar.</p><div class="rank-options">${App.rank.map((id,i)=>`<div><b>${i+1}</b><span>${esc(q.options[id])}</span>${B('↑','rank',`data-index="${i}" data-dir="-1" ${i===0?'disabled':''}`)}${B('↓','rank',`data-index="${i}" data-dir="1" ${i===3?'disabled':''}`)}</div>`).join('')}</div><p class="hint">Ordem exata: +2. Soma dos deslocamentos até 4: +1. Acima de 4: 0.</p>`;
 if(q.type==='desenho')form=`<label>Seu desenho secreto</label><canvas id="drawing" width="320" height="200" aria-label="Área de desenho"></canvas><div class="drawing-tools">${['#314d68','#a8404e','#956418'].map(c=>B('●','brush',`data-color="${c}" style="color:${c}" aria-label="Pincel ${c}"`)).join('')}${B('Borracha','erase')}${B('Limpar','clear')}</div><p class="hint">Três cores e criatividade. Não vale escrever a resposta!</p>`;
 return form+`${v.individual?`<div class="skip-row">${B('↻ Pular pergunta ('+v.skipsLeft+'/3)','skip',v.canSkip?'':'disabled','ghost small')}<small>Três pulos por pessoa na partida. Troca só esta pergunta.</small></div>`:''}<div class="answer-bar">${['texto','emoji'].includes(q.type)?B(App.secret?'Mostrar':'Ocultar','eye','','small'):''}${B(royal?'Guardar segredo':'Enviar palpite','submit','','primary')}</div>`},
 progress(v){return `<div class="progress"><i style="width:${v.submitted.length/Math.max(1,v.players.length-1)*100}%"></i></div><small>${v.submitted.length}/${v.players.length-1} pergaminhos recebidos</small>`},
 score(v){return [...v.players].sort((a,b)=>b.score-a.score).map(p=>`<div class="player">${portrait(p.skin)}<span><b>${esc(p.name)}${p.id===v.king?' ♛':''}</b><small>${plural(p.crowns||0,'coroa','coroas')} · ${plural(p.hearts||0,'resposta perfeita','respostas perfeitas')}</small><small>${p.step||0}/${v.cfg.steps} degraus${p.online===false?' · desconectado':''}</small></span><strong>${p.score||0}</strong></div>`).join('')},
 qr(){try{const qr=qrcode(0,'M');qr.addData(Net.link());qr.make();const n=qr.getModuleCount(),c=document.createElement('canvas'),g=c.getContext('2d'),s=Math.max(3,Math.floor(230/(n+8)));c.width=c.height=(n+8)*s;g.fillStyle='white';g.fillRect(0,0,c.width,c.height);g.fillStyle='#122a3b';for(let r=0;r<n;r++)for(let col=0;col<n;col++)if(qr.isDark(r,col))g.fillRect((col+4)*s,(r+4)*s,s,s);$('#qr').append(c)}catch{toast('Não foi possível criar o QR. Copie o convite.')}},
 tick(){if($('#timer'))$('#timer').textContent=S?.deadline?Math.max(0,Math.ceil((S.deadline-Date.now())/1000))+' s restantes':'';$$('[data-wait]').forEach(b=>b.disabled=Date.now()<Number(b.dataset.wait))},
 modal(title,body){$('#dialog-body').innerHTML=`<div class="row between"><h2>${title}</h2>${B('Fechar','closemodal')}</div>${body}`;$('#dialog').showModal()},
 help(){this.modal('Uma coroa. Seis jeitos de jogar.',`<p>Cerca de 60% das rodadas são de texto; 40% alternam os outros cinco formatos. Cada súdito recebe uma pergunta diferente sobre a majestade, no mesmo formato da rodada. Antes de enviar, você pode pular até três perguntas por partida. Nos formatos automáticos, a majestade guarda um gabarito para cada pergunta; ao pular, ela prepara o novo gabarito.</p><p>Responda sobre a pessoa no trono. Cada degrau vale 100 pontos e conquistar a coroa vale mais 300.</p><p><b>Texto, emoji e desenho:</b> a majestade avalia. Com Favorita da coroa ligada, exatamente uma resposta recebe ♥ (+2); as demais recebem 0 ou +1. Quem continua no trono ganha 50 pontos.</p><p><b>Escolha:</b> adivinhe uma entre quatro opções (+2). <b>Escala:</b> exato +2; até dois pontos de diferença +1. <b>Ranking:</b> ordem exata +2; soma das distâncias até 4 dá +1.</p><p>Na revelação, o anfitrião mostra texto → nota → autor → subida. Ao trocar a coroa, os súditos descem pela metade por padrão. A antiga majestade volta ao zero. Empate na disputa: mais degraus, mais pontos e, persistindo, sorteio. No final, empate em pontos compartilha a vitória.</p><p><b>Presencial:</b> passem o aparelho. <b>Online:</b> reentrada pelo mesmo apelido, código e navegador; o anfitrião precisa continuar online. Respostas de quem cai são encerradas automaticamente. Se a majestade cair no meio da rodada, assume quem tem mais degraus (empate: sorteio) e a mesma pergunta recomeça sem duplicar pontos.</p><p><b>Telão:</b> publique index.html e three.r160.min.js juntos para que os celulares abram o convite do QR. O telão não participa como jogador. Voz: use uma chamada à parte.</p><p>Q/W/E avaliam · Enter envia · C centraliza · Esc abre opções. Movimento reduzido segue a preferência do sistema.</p><p>Bots usam bancos de respostas próprios e avaliações simuladas. Na pergunta personalizada, eles não entendem o enunciado e usam palpites de demonstração.</p>`)},
 options(){this.modal('Opções do reino',`<label for="quality">Qualidade gráfica</label><select id="quality">${[['auto','Automática'],['high','Alta'],['medium','Média'],['low','Baixa']].map(([k,n])=>`<option value="${k}" ${App.quality===k?'selected':''}>${n}</option>`).join('')}</select><p class="hint">Automática mede o desempenho inicial. A qualidade escolhida fica salva. Preferência atual de movimento reduzido: ${reduced()?'ligada':'desligada'}.</p>${B(App.muted?'Ativar som':'Desativar som','sound')}${B('Como jogar','help')}${App.host&&S?.phase!=='lobby'?B('Encerrar partida no placar atual','endmatch','','danger'):''}`)}
};
const Actions={
 open(d){App.setupMode=d.mode;App.screen='setup';App.progress='';UI.render()},home(){App.screen='home';UI.render()},skin(d){App.selected=+d.skin;UI.render()},
 add(){const name=($('#nickname').value.trim()||'Sua Majestade').slice(0,22);if(App.roster.length>=8)return toast('A corte já tem oito jogadores.');if(App.roster.some(p=>p.name.toLowerCase()===name.toLowerCase()))return toast('Escolha um apelido diferente.');App.roster.push({id:uid(),name,skin:App.selected});App.nickname='';$('#nickname').value='';App.selected=(App.selected+1)%8;UI.render()},remove(d){App.roster.splice(+d.index,1);UI.render()},
 start(){try{const name=($('#nickname')?.value.trim()||'Sua Majestade').slice(0,22),profile={name,skin:App.selected};App.nickname=name;switch(App.setupMode){case 'local':App.mode='local';App.host=false;App.spectator=false;Rules.start(App.roster,UI.readConfig());break;case 'bots':App.mode='bots';App.host=false;App.spectator=false;App.me=uid();Rules.start([{id:App.me,...profile},...[['Pipoca',2],['Cosmo',3],['Brasa',5]].map(([name,skin])=>({id:uid(),name:name+' · bot',skin,bot:true}))],UI.readConfig());break;case 'host':Net.create(profile,false);break;case 'tv':Net.create(profile,true);break;case 'join':App.joinCode=$('#code').value.trim().toUpperCase();Net.join(profile,App.joinCode);break}}catch(e){toast(e.message)}},
 hoststart(){try{const p=S.players.filter(p=>p.online);if(p.length<3)return toast('Espere três jogadores.');Rules.start(p,UI.readConfig())}catch(e){toast(e.message)}},
